# Planner settings the book's EXPLAIN output was captured under.
#
# The database-level knobs are applied automatically by scripts/reset-to-chapter.ps1
# (ALTER DATABASE lumina SET ...), so you normally never need this file. It exists
# for readers running a server they cannot ALTER, and as the single documented list.
#
# Server-level (need a restart; the docker-compose.yml passes them as -c flags):
shared_buffers = 512MB
effective_cache_size = 2GB
max_parallel_workers_per_gather = 2
timezone = 'UTC'
# Chapter 18's pg_stat_statements view needs the library preloaded, and Chapter 20's
# logical replication needs wal_level=logical. Both are restart-only, which is why
# listings 18-13 and 20-05/20-06 are marked run:'none' for the harness: it cannot
# restart a server. The compose file sets both, so the container has them already.
shared_preload_libraries = 'pg_stat_statements'
wal_level = logical

# Database-level (applied by reset-to-chapter.ps1):
#   jit = off                  -- above a cost threshold, JIT flips plans and adds a
#                              -- JIT block to EXPLAIN; off keeps output hardware-independent
#   work_mem = 16MB            -- fixes hash vs. sort spill decisions
#   random_page_cost = 1.1     -- SSD assumption; the default 4.0 is spinning-rust era
